name: Build Android APK + AAB

# Lets the dashboard match a workflow_dispatch back to the run it created —
# the dispatch API responds 204 with no run ID, so it polls the runs list
# and matches on this name instead of guessing "most recent run".
run-name: "Build ${{ inputs.app_name }} (${{ inputs.build_id }})"

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Dashboard app ID — used to serialize builds per app"
        required: true
      app_name:
        description: "Display name of the app"
        required: true
      package_name:
        description: "Android package name (e.g. com.mystore.app)"
        required: true
      url:
        description: "Website URL to wrap"
        required: true
      permissions:
        description: "Comma-separated permission keys (camera,location,microphone,notifications,storage)"
        required: false
        default: ""
      pinch_zoom:
        description: "'true' enables native pinch-to-zoom on the WebView, 'false' disables it"
        required: false
        default: "true"
      allowed_domains:
        description: "Unused by the native app (kept only so the dashboard's existing input isn't rejected) — see AppConfig.kt/MainActivity.kt for the fixed blocklist this app actually uses"
        required: false
        default: ""
      bottom_nav_enabled:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "false"
      bottom_nav_tabs:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "[]"
      app_lock_enabled:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "false"
      custom_css:
        description: "CSS injected into the wrapped site on every navigation (capped at 10KB by the dashboard)"
        required: false
        default: ""
      custom_js:
        description: "JavaScript injected into the wrapped site on every navigation (capped at 10KB by the dashboard)"
        required: false
        default: ""
      build_id:
        description: "Dashboard build record ID — sent back in the webhook"
        required: true
      version_code:
        description: "Android versionCode for this build — monotonic per app, Play rejects re-used values"
        required: false
        default: "1"
      version_name:
        description: "User-visible version string (e.g. 1.0.3)"
        required: false
        default: "1.0.0"
      google_services_json:
        description: "Base64-encoded google-services.json (required when notifications permission is enabled)"
        required: false
        default: ""
      icon_url:
        description: "Public R2 URL of the app icon (downloaded into the build)"
        required: true
      splash_url:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: ""
      splash_type:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "auto"
      splash_bg_light:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "#ffffff"
      splash_bg_dark:
        description: "Not yet implemented in the native app — accepted but unused"
        required: false
        default: "#000000"
      existing_keystore_base64:
        description: "Base64-encoded release keystore from a previous build of this app (empty on first build)"
        required: false
        default: ""
      existing_store_password:
        description: "Store password for existing_keystore_base64"
        required: false
        default: ""
      existing_key_password:
        description: "Key password for existing_keystore_base64"
        required: false
        default: ""
      existing_key_alias:
        description: "Key alias for existing_keystore_base64"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # Defense in depth alongside the dashboard's own "one build in flight
    # per app" guard — GitHub itself won't run two builds for the same
    # app concurrently even if that API-level check is ever bypassed.
    concurrency:
      group: build-${{ inputs.app_id }}
      cancel-in-progress: false

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Toolchain ──────────────────────────────────────────
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false

      # ── 3. Rename the Kotlin package + generate AppConfig.kt ──
      # Native Android (unlike Expo) requires the Kotlin source to
      # physically live in a folder tree matching the package, and every
      # file's own `package` declaration to match too — this moves
      # app/src/main/java/in/truckflow/app to the real package's path and
      # rewrites both .kt files' package lines, then writes a fresh
      # AppConfig.kt (this build's equivalent of config.js) at the new
      # location. See .github/scripts/*.py for all the patching logic in
      # this and the following few steps — kept as real files rather than
      # inline heredocs, since a heredoc's content can't be indented to
      # match this YAML block without breaking either YAML's own
      # indentation rules or Python's.
      - name: Rename package and generate AppConfig.kt
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_URL:      ${{ inputs.url }}
          PINCH_ZOOM:   ${{ inputs.pinch_zoom }}
          CUSTOM_CSS:   ${{ inputs.custom_css }}
          CUSTOM_JS:    ${{ inputs.custom_js }}
          PERMISSIONS:  ${{ inputs.permissions }}
        run: python3 .github/scripts/rename_package.py

      # ── 4. Patch build.gradle.kts (namespace, applicationId, version) ─
      - name: Patch build.gradle.kts
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: python3 .github/scripts/patch_gradle.py

      # ── 5. Patch AndroidManifest.xml ───────────────────────────
      - name: Patch AndroidManifest.xml
        env:
          PACKAGE_NAME: ${{ inputs.package_name }}
          APP_URL:      ${{ inputs.url }}
          PERMISSIONS:  ${{ inputs.permissions }}
        run: python3 .github/scripts/patch_manifest.py

      # ── 6. App name + icon ──────────────────────────────────────
      - name: Patch app name and icon
        env:
          APP_NAME: ${{ inputs.app_name }}
          ICON_URL: ${{ inputs.icon_url }}
        run: |
          set -e
          mkdir -p app/src/main/res/drawable
          curl -fsSL "$ICON_URL" -o /tmp/icon_source
          # The dashboard accepts whatever image format a customer
          # uploads (jpg, webp, ...) — don't trust icon_url's own
          # extension, always re-encode to a real PNG. AAPT2 rejects a
          # file with a .png name whose bytes aren't actually PNG (that's
          # exactly what broke the first real build: a customer's .jpg
          # icon landing here unconverted).
          convert /tmp/icon_source app/src/main/res/drawable/ic_launcher_foreground.png
          echo "✓ Icon downloaded from R2 and normalized to PNG"
          python3 .github/scripts/patch_icon.py

      # ── 7. Firebase config ──────────────────────────────────────
      # The google-services Gradle plugin hard-requires a valid
      # google-services.json to exist regardless of whether this build
      # actually wants notifications — when they're off (or the dashboard
      # didn't send a config), configure_firebase.py writes a
      # syntactically valid placeholder instead. AppConfig.NOTIFICATIONS_ENABLED
      # (previous step) is what actually gates any runtime behavior; this
      # file alone never turns notifications on.
      - name: Configure Firebase
        env:
          PACKAGE_NAME:         ${{ inputs.package_name }}
          PERMISSIONS:          ${{ inputs.permissions }}
          GOOGLE_SERVICES_JSON: ${{ inputs.google_services_json }}
        run: python3 .github/scripts/configure_firebase.py

      # ── 8. Configure release signing ───────────────────────────
      # A fresh checkout has no cached ~/.android, so Android Gradle
      # Plugin would auto-generate a brand-new random debug keystore on
      # every run if release stayed unsigned/debug-signed — that makes
      # every APK's signature different, so an update could never install
      # over a previous version (Android rejects the signature mismatch).
      # Fix: give the app a real, persistent release key. Reuse the one
      # from a previous build if the dashboard sent one; otherwise
      # generate a new one now and report it back in the success webhook
      # so the dashboard can pass it in on the next build of this app.
      - name: Configure release signing
        env:
          EXISTING_KEYSTORE_BASE64: ${{ inputs.existing_keystore_base64 }}
          EXISTING_STORE_PASSWORD:  ${{ inputs.existing_store_password }}
          EXISTING_KEY_PASSWORD:    ${{ inputs.existing_key_password }}
          EXISTING_KEY_ALIAS:       ${{ inputs.existing_key_alias }}
        run: |
          set -e
          KEYSTORE_PATH="app/release.keystore"

          if [ -n "$EXISTING_KEYSTORE_BASE64" ]; then
            echo "$EXISTING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASSWORD="$EXISTING_STORE_PASSWORD"
            KEY_PASSWORD="$EXISTING_KEY_PASSWORD"
            KEY_ALIAS="$EXISTING_KEY_ALIAS"
            IS_NEW_KEYSTORE="false"
            echo "✓ Reusing this app's existing signing key"
          else
            STORE_PASSWORD=$(openssl rand -hex 16)
            # PKCS12 (keytool's default format since JDK 8u141, including
            # Java 17 here) has no concept of a per-key password separate
            # from the store password — keytool silently ignores -keypass
            # when it differs and encrypts the key with storepass anyway,
            # but build.gradle.kts would still tell Gradle to decrypt with
            # the (unused) different KEY_PASSWORD at sign time, failing
            # with "Given final block not properly padded". Keep identical.
            KEY_PASSWORD="$STORE_PASSWORD"
            KEY_ALIAS="release-$(openssl rand -hex 4)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Capsule,OU=Capsule,O=Capsule,L=Unknown,ST=Unknown,C=US" \
              > /dev/null
            IS_NEW_KEYSTORE="true"
            echo "✓ Generated a new signing key for this app's first build"
          fi

          # Mask secrets so they never appear in step logs from here on
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"

          echo "STORE_PASSWORD=${STORE_PASSWORD}"     >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}"         >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}"               >> "$GITHUB_ENV"
          echo "IS_NEW_KEYSTORE=${IS_NEW_KEYSTORE}"   >> "$GITHUB_ENV"

          if [ "$IS_NEW_KEYSTORE" = "true" ]; then
            NEW_KEYSTORE_BASE64=$(base64 -w0 "$KEYSTORE_PATH")
            echo "::add-mask::${NEW_KEYSTORE_BASE64}"
            # Kept out of GITHUB_ENV (which shows up in the run's env
            # dump) — written to a file only this job can read instead.
            echo -n "$NEW_KEYSTORE_BASE64" > /tmp/new_keystore_base64.txt
          fi

          python3 .github/scripts/configure_signing.py

      # ── 9. Build release APK + AAB ──────────────────────────────
      # Both in one Gradle invocation on purpose: the expensive work
      # (javac, dexing, merged resources) is shared between the two tasks
      # and only runs once. Splitting this into two steps would re-run
      # configuration and lose that sharing.
      - name: Build APK and AAB
        run: |
          # Teed to a file so the failure webhook can hand the user the
          # actual Gradle error instead of a bare "Failed". pipefail is
          # what keeps tee from swallowing gradlew's exit code.
          set -o pipefail
          ./gradlew assembleRelease bundleRelease 2>&1 | tee /tmp/build.log

      # ── 10. Upload APK + AAB to Cloudflare R2 ──────────────────
      - name: Upload APK and AAB to Cloudflare R2
        id: upload
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
          BUILD_ID:             ${{ inputs.build_id }}
        run: |
          set -e
          export AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}"
          export AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}"

          upload() {
            aws s3 cp "$1" "s3://${R2_BUCKET_NAME}/$2" \
              --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
              --region auto \
              --no-progress
          }

          APK="app/build/outputs/apk/release/app-release.apk"
          APK_KEY="apks/${BUILD_ID}/app-release.apk"
          upload "${APK}" "${APK_KEY}"
          DOWNLOAD_URL="${R2_PUBLIC_URL}/${APK_KEY}"
          echo "DOWNLOAD_URL=${DOWNLOAD_URL}" >> "$GITHUB_ENV"
          echo "✓ APK uploaded to R2 — ${DOWNLOAD_URL}"

          # The AAB is for uploading to Play. Treated as best-effort: if
          # the bundle is missing the APK build still stands on its own,
          # and the dashboard simply won't offer an AAB download.
          AAB="app/build/outputs/bundle/release/app-release.aab"
          if [ -f "${AAB}" ]; then
            AAB_KEY="apks/${BUILD_ID}/app-release.aab"
            upload "${AAB}" "${AAB_KEY}"
            AAB_DOWNLOAD_URL="${R2_PUBLIC_URL}/${AAB_KEY}"
            echo "AAB_DOWNLOAD_URL=${AAB_DOWNLOAD_URL}" >> "$GITHUB_ENV"
            echo "✓ AAB uploaded to R2 — ${AAB_DOWNLOAD_URL}"
          else
            echo "AAB_DOWNLOAD_URL=" >> "$GITHUB_ENV"
            echo "⚠ No AAB at ${AAB} — continuing with the APK only"
          fi

          # Extract SHA256 fingerprint from the signed APK. `keytool
          # -printcert -jarfile` only understands the legacy v1/JAR
          # signing scheme — AGP signs release builds with v2 (and no v1)
          # by default, which keytool silently reports as "Not a signed
          # jar file", so this used apksigner instead, and reformats its
          # lowercase-no-colons digest into the AA:BB:CC:... form
          # assetlinks.json and Play Console both expect.
          APKSIGNER=$(find "${ANDROID_HOME}/build-tools" -maxdepth 2 -name apksigner | sort -V | tail -1)
          SHA256=$("$APKSIGNER" verify --print-certs "${APK}" \
            | grep "certificate SHA-256 digest" \
            | sed 's/.*: //' \
            | tr 'a-f' 'A-F' \
            | sed 's/../&:/g; s/:$//')
          echo "SHA256_FINGERPRINT=${SHA256}" >> "$GITHUB_ENV"
          echo "✓ SHA256 fingerprint: ${SHA256}"

      # ── 11. Notify dashboard — success ─────────────────────────
      # Only includes keystore fields when this build generated a brand
      # new signing key (first build for this app) — the dashboard
      # persists it so the next build reuses the same key.
      - name: Webhook — success
        if: success()
        env:
          WEBHOOK_URL:      ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET:   ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID:         ${{ inputs.build_id }}
          IS_NEW_KEYSTORE:  ${{ env.IS_NEW_KEYSTORE }}
          KEY_ALIAS:        ${{ env.KEY_ALIAS }}
          STORE_PASSWORD:   ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD:     ${{ env.KEY_PASSWORD }}
        run: |
          if [ "$IS_NEW_KEYSTORE" = "true" ]; then
            NEW_KEYSTORE_BASE64=$(cat /tmp/new_keystore_base64.txt)
            PAYLOAD=$(jq -n \
              --arg build_id "$BUILD_ID" \
              --arg download_url "$DOWNLOAD_URL" \
              --arg aab_download_url "$AAB_DOWNLOAD_URL" \
              --arg sha256_fingerprint "$SHA256_FINGERPRINT" \
              --arg keystore_base64 "$NEW_KEYSTORE_BASE64" \
              --arg key_alias "$KEY_ALIAS" \
              --arg store_password "$STORE_PASSWORD" \
              --arg key_password "$KEY_PASSWORD" \
              '{build_id: $build_id, status: "success", download_url: $download_url,
                aab_download_url: $aab_download_url,
                sha256_fingerprint: $sha256_fingerprint, keystore_base64: $keystore_base64,
                key_alias: $key_alias, store_password: $store_password, key_password: $key_password}')
          else
            PAYLOAD=$(jq -n \
              --arg build_id "$BUILD_ID" \
              --arg download_url "$DOWNLOAD_URL" \
              --arg aab_download_url "$AAB_DOWNLOAD_URL" \
              --arg sha256_fingerprint "$SHA256_FINGERPRINT" \
              '{build_id: $build_id, status: "success", download_url: $download_url,
                aab_download_url: $aab_download_url,
                sha256_fingerprint: $sha256_fingerprint}')
          fi

          curl -fsSL -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "$PAYLOAD"
          echo "✓ Webhook notified — success"

      # ── 12. Notify dashboard — failure ─────────────────────────
      - name: Webhook — failure
        if: failure()
        env:
          WEBHOOK_URL:    ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID:       ${{ inputs.build_id }}
          STORE_PASSWORD: ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD:   ${{ env.KEY_PASSWORD }}
        run: |
          # The tail is where Gradle prints "FAILURE:" and the actual
          # cause; the preceding few thousand lines are task noise nobody
          # reads. Capped by bytes as well as lines because a single
          # stack trace line can be enormous.
          if [ -f /tmp/build.log ]; then
            LOGS=$(tail -n 200 /tmp/build.log | tail -c 15000)
          else
            LOGS="The build failed before Gradle started — usually while renaming the package, patching the manifest, or fetching the icon. Nothing was compiled."
          fi

          # Belt and braces. Gradle has no reason to echo the signing
          # passwords, but this log is about to be shown in a browser, so
          # it is not the place to find out we were wrong.
          [ -n "$STORE_PASSWORD" ] && LOGS=${LOGS//"$STORE_PASSWORD"/***REDACTED***}
          [ -n "$KEY_PASSWORD" ]   && LOGS=${LOGS//"$KEY_PASSWORD"/***REDACTED***}

          # jq builds the JSON so newlines, quotes and backslashes in the
          # log can't break the payload.
          PAYLOAD=$(jq -n \
            --arg build_id "$BUILD_ID" \
            --arg logs "$LOGS" \
            '{build_id: $build_id, status: "failed", download_url: "", logs: $logs}')

          curl -fsSL -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "$PAYLOAD" || true
          echo "✓ Webhook notified — failure"
