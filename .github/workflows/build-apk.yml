name: Build Android APK

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'webview-template/package-lock.json'

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: webview-template
        run: npm ci

      - name: Setup Expo
        working-directory: webview-template
        run: npx expo install --check

      - name: Generate Android project
        working-directory: webview-template
        run: npx expo prebuild --platform android --clean

      - name: Build APK
        working-directory: webview-template/android
        run: ./gradlew assembleRelease

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: app-release
          path: webview-template/android/app/build/outputs/apk/release/app-release.apk
