name: Build Android APK

# Lets the dashboard match a workflow_dispatch back to the run it created —
# the dispatch API responds 204 with no run ID, so it polls the runs list
# and matches on this name instead of guessing "most recent run".
run-name: "Build ${{ inputs.app_name }} (${{ inputs.build_id }})"

on:
  workflow_dispatch:
    inputs:
      app_id:
        description: "Dashboard app ID — used to serialize builds per app"
        required: true
      app_name:
        description: "Display name of the app"
        required: true
      package_name:
        description: "Android package name (e.g. com.mystore.app)"
        required: true
      url:
        description: "Website URL to wrap"
        required: true
      permissions:
        description: "Comma-separated permission keys (camera,location,microphone,notifications,storage)"
        required: false
        default: ""
      build_id:
        description: "Dashboard build record ID — sent back in the webhook"
        required: true
      google_services_json:
        description: "Base64-encoded google-services.json (required when notifications permission is enabled)"
        required: false
        default: ""
      icon_url:
        description: "Public R2 URL of the app icon (downloaded into the build)"
        required: true
      splash_url:
        description: "Public R2 URL of the splash screen (optional)"
        required: false
        default: ""
      existing_keystore_base64:
        description: "Base64-encoded release keystore from a previous build of this app (empty on first build)"
        required: false
        default: ""
      existing_store_password:
        description: "Store password for existing_keystore_base64"
        required: false
        default: ""
      existing_key_password:
        description: "Key password for existing_keystore_base64"
        required: false
        default: ""
      existing_key_alias:
        description: "Key alias for existing_keystore_base64"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    # Defense in depth alongside the dashboard's own "one build in flight
    # per app" guard — GitHub itself won't run two builds for the same
    # app concurrently even if that API-level check is ever bypassed.
    concurrency:
      group: build-${{ inputs.app_id }}
      cancel-in-progress: false

    steps:
      # ── 1. Checkout ───────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Toolchain ──────────────────────────────────────────
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Gradle (with caching)
        uses: gradle/actions/setup-gradle@v3
        with:
          cache-read-only: false
          gradle-home-cache-includes: |
            caches/modules-2
            wrapper/dists

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # ── 3. Inject app config ──────────────────────────────────
      - name: Patch config.js and app.json
        env:
          APP_NAME:     ${{ inputs.app_name }}
          APP_URL:      ${{ inputs.url }}
          PACKAGE_NAME: ${{ inputs.package_name }}
        run: |
          node - << 'EOF'
          const fs = require("fs");

          // config.js — sets the WebView URL
          fs.writeFileSync("config.js",
            `export const config = {\n  webViewUrl: ${JSON.stringify(process.env.APP_URL)},\n};\n`
          );

          // app.json — sets display name + package name
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
          app.expo.name                = process.env.APP_NAME;
          app.expo.android             = app.expo.android || {};
          app.expo.android.package     = process.env.PACKAGE_NAME;
          // Clear deep-link intent filters — they belong to the original project
          app.expo.android.intentFilters = [];
          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          console.log("✓ config.js and app.json patched");
          EOF

      # ── 4. Download icon and splash from R2 ──────────────────
      - name: Download icon and splash
        env:
          ICON_URL:   ${{ inputs.icon_url }}
          SPLASH_URL: ${{ inputs.splash_url }}
        run: |
          mkdir -p assets

          curl -fsSL "$ICON_URL" -o assets/user-icon.png
          echo "✓ Icon downloaded from R2"

          if [ -n "$SPLASH_URL" ]; then
            curl -fsSL "$SPLASH_URL" -o assets/user-splash.png
            echo "✓ Splash downloaded from R2"
          fi

          node - << 'EOF'
          const fs = require("fs");
          const app = JSON.parse(fs.readFileSync("app.json", "utf8"));

          app.expo.icon = "./assets/user-icon.png";
          if (!app.expo.android) app.expo.android = {};
          if (!app.expo.android.adaptiveIcon) app.expo.android.adaptiveIcon = {};
          app.expo.android.adaptiveIcon.foregroundImage = "./assets/user-icon.png";

          const hasSplash = (process.env.SPLASH_URL || "").trim() !== "";
          if (hasSplash) {
            if (!app.expo.splash) app.expo.splash = {};
            app.expo.splash.image = "./assets/user-splash.png";
          }

          fs.writeFileSync("app.json", JSON.stringify(app, null, 2));
          console.log("✓ app.json updated with custom icon" + (hasSplash ? " and splash" : ""));
          EOF

      # ── 5. Install dependencies ───────────────────────────────
      - name: Install dependencies
        run: npm ci

      # ── 6. Firebase config ────────────────────────────────────────
      - name: Configure Firebase (or strip if not enabled)
        env:
          PERMISSIONS:          ${{ inputs.permissions }}
          GOOGLE_SERVICES_JSON: ${{ inputs.google_services_json }}
        run: |
          node - << 'EOF'
          const fs   = require("fs");
          const perms = (process.env.PERMISSIONS || "").split(",").map(s => s.trim());
          const gsJson = (process.env.GOOGLE_SERVICES_JSON || "").trim();

          if (perms.includes("notifications") && gsJson) {
            // Write google-services.json from the base64 input
            fs.writeFileSync("google-services.json", Buffer.from(gsJson, "base64").toString("utf8"));
            console.log("✓ google-services.json written from build input");
          } else {
            // Notifications not enabled — strip Firebase from the build
            const app = JSON.parse(fs.readFileSync("app.json", "utf8"));
            app.expo.plugins = (app.expo.plugins || []).filter(p => p !== "@react-native-firebase/app");
            if (app.expo.android) delete app.expo.android.googleServicesFile;
            fs.writeFileSync("app.json", JSON.stringify(app, null, 2));

            // Remove notifications.js so Firebase is never imported
            if (fs.existsSync("notifications.js")) fs.unlinkSync("notifications.js");

            // Patch App.js to remove the useNotifications import and hook call
            let appJs = fs.readFileSync("App.js", "utf8");
            appJs = appJs.replace(/^import \{ useNotifications \} from '\.\/notifications';\n/m, "");
            appJs = appJs.replace(/^  const \{ notificationUrl \} = useNotifications\(\);\n/m, "");
            appJs = appJs.replace(/^  useEffect\(\(\) => \{\n    if \(notificationUrl\) setCurrentUrl\(notificationUrl\);\n  \}, \[notificationUrl\]\);\n/m, "");
            fs.writeFileSync("App.js", appJs);

            console.log("✓ Firebase stripped — notifications not enabled for this build");
          }

          // ── Camera ──────────────────────────────────────────────
          if (!perms.includes("camera")) {
            if (fs.existsSync("camera.js")) fs.unlinkSync("camera.js");
            let appJs = fs.readFileSync("App.js", "utf8");
            appJs = appJs.replace(/^import \{ handleCameraRequest \} from '\.\/camera';\n/m, "");
            appJs = appJs.replace(/^      handleCameraRequest\(request\.resources\),\n/m, "");
            fs.writeFileSync("App.js", appJs);
            console.log("✓ Camera stripped — camera not enabled for this build");
          }

          // ── Microphone ───────────────────────────────────────────
          if (!perms.includes("microphone")) {
            if (fs.existsSync("microphone.js")) fs.unlinkSync("microphone.js");
            let appJs = fs.readFileSync("App.js", "utf8");
            appJs = appJs.replace(/^import \{ handleMicrophoneRequest \} from '\.\/microphone';\n/m, "");
            appJs = appJs.replace(/^      handleMicrophoneRequest\(request\.resources\),\n/m, "");
            fs.writeFileSync("App.js", appJs);
            console.log("✓ Microphone stripped — microphone not enabled for this build");
          }

          // ── Location ─────────────────────────────────────────────
          if (!perms.includes("location")) {
            if (fs.existsSync("location.js")) fs.unlinkSync("location.js");
            let appJs = fs.readFileSync("App.js", "utf8");
            appJs = appJs.replace(/^import \{ handleLocationRequest \} from '\.\/location';\n/m, "");
            appJs = appJs.replace(/^      handleLocationRequest\(request\.resources\),\n/m, "");
            appJs = appJs.replace(/^          geolocationEnabled=\{true\}\n/m, "");
            fs.writeFileSync("App.js", appJs);
            console.log("✓ Location stripped — location not enabled for this build");
          }

          // ── Storage / Photo Library ──────────────────────────────
          if (!perms.includes("storage")) {
            if (fs.existsSync("storage.js")) fs.unlinkSync("storage.js");
            console.log("✓ Storage stripped — photo library not enabled for this build");
          }

          // ── Strip WebView permission handler if nothing uses it ──
          if (!perms.includes("camera") && !perms.includes("microphone") && !perms.includes("location")) {
            let appJs = fs.readFileSync("App.js", "utf8");
            appJs = appJs.replace(/\n  const handleWebViewPermission[\s\S]+?  \};\n/, "\n");
            appJs = appJs.replace(/^          onPermissionRequest=\{handleWebViewPermission\}\n/m, "");
            fs.writeFileSync("App.js", appJs);
            console.log("✓ WebView permission handler removed — no permissions need it");
          }
          EOF

      # ── 7. Expo prebuild ──────────────────────────────────────
      - name: Generate Android project
        run: npx expo prebuild --platform android --clean

      # ── 8. Inject permissions into AndroidManifest.xml ────────
      - name: Inject Android permissions
        env:
          PERMISSIONS: ${{ inputs.permissions }}
        run: |
          python3 << 'PYEOF'
          import os, re

          manifest_path = "android/app/src/main/AndroidManifest.xml"
          permissions_input = os.environ.get("PERMISSIONS", "").strip()

          PERMISSION_MAP = {
              "notifications": ["android.permission.POST_NOTIFICATIONS"],
              "camera":        ["android.permission.CAMERA"],
              "microphone":    ["android.permission.RECORD_AUDIO"],
              "location":      [
                  "android.permission.ACCESS_FINE_LOCATION",
                  "android.permission.ACCESS_COARSE_LOCATION",
              ],
              "storage":       [
                  "android.permission.READ_MEDIA_IMAGES",
                  "android.permission.READ_EXTERNAL_STORAGE",
              ],
          }

          manifest = open(manifest_path).read()
          existing = set(re.findall(r'uses-permission android:name="([^"]+)"', manifest))

          to_add = []
          for key in permissions_input.split(","):
              key = key.strip()
              if key in PERMISSION_MAP:
                  for perm in PERMISSION_MAP[key]:
                      if perm not in existing:
                          to_add.append(perm)

          if to_add:
              lines = "\n".join(
                  f'    <uses-permission android:name="{p}"/>' for p in to_add
              )
              manifest = manifest.replace("</manifest>", f"{lines}\n</manifest>")
              open(manifest_path, "w").write(manifest)
              print(f"✓ Added {len(to_add)} permission(s): {to_add}")
          else:
              print("✓ No new permissions needed")
          PYEOF

      # ── 9. Configure release signing ───────────────────────────
      # Expo prebuild's generated build.gradle signs release builds with
      # signingConfigs.debug — and since the runner is a fresh checkout
      # with no cached ~/.android, Android Gradle Plugin auto-generates a
      # brand-new random debug keystore on every single run. That makes
      # every APK's signature different, so an update can never install
      # over a previous version (Android rejects the signature mismatch).
      # Fix: give the app a real, persistent release key. Reuse the one
      # from a previous build if the dashboard sent one; otherwise
      # generate a new one now and report it back in the success webhook
      # so the dashboard can pass it in on the next build of this app.
      - name: Configure release signing
        env:
          EXISTING_KEYSTORE_BASE64: ${{ inputs.existing_keystore_base64 }}
          EXISTING_STORE_PASSWORD:  ${{ inputs.existing_store_password }}
          EXISTING_KEY_PASSWORD:    ${{ inputs.existing_key_password }}
          EXISTING_KEY_ALIAS:       ${{ inputs.existing_key_alias }}
        run: |
          set -e
          KEYSTORE_PATH="android/app/release.keystore"

          if [ -n "$EXISTING_KEYSTORE_BASE64" ]; then
            echo "$EXISTING_KEYSTORE_BASE64" | base64 -d > "$KEYSTORE_PATH"
            STORE_PASSWORD="$EXISTING_STORE_PASSWORD"
            KEY_PASSWORD="$EXISTING_KEY_PASSWORD"
            KEY_ALIAS="$EXISTING_KEY_ALIAS"
            IS_NEW_KEYSTORE="false"
            echo "✓ Reusing this app's existing signing key"
          else
            STORE_PASSWORD=$(openssl rand -hex 16)
            KEY_PASSWORD=$(openssl rand -hex 16)
            KEY_ALIAS="release-$(openssl rand -hex 4)"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass "$STORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -dname "CN=Capsule,OU=Capsule,O=Capsule,L=Unknown,ST=Unknown,C=US" \
              > /dev/null
            IS_NEW_KEYSTORE="true"
            echo "✓ Generated a new signing key for this app's first build"
          fi

          # Mask secrets so they never appear in step logs from here on
          echo "::add-mask::${STORE_PASSWORD}"
          echo "::add-mask::${KEY_PASSWORD}"

          echo "STORE_PASSWORD=${STORE_PASSWORD}"     >> "$GITHUB_ENV"
          echo "KEY_PASSWORD=${KEY_PASSWORD}"         >> "$GITHUB_ENV"
          echo "KEY_ALIAS=${KEY_ALIAS}"               >> "$GITHUB_ENV"
          echo "IS_NEW_KEYSTORE=${IS_NEW_KEYSTORE}"   >> "$GITHUB_ENV"

          if [ "$IS_NEW_KEYSTORE" = "true" ]; then
            NEW_KEYSTORE_BASE64=$(base64 -w0 "$KEYSTORE_PATH")
            echo "::add-mask::${NEW_KEYSTORE_BASE64}"
            # Kept out of GITHUB_ENV (which shows up in the run's env
            # dump) — written to a file only this job can read instead.
            echo -n "$NEW_KEYSTORE_BASE64" > /tmp/new_keystore_base64.txt
          fi

          # Wire the release build type to this keystore instead of the
          # debug one Expo's template defaults to.
          python3 << 'PYEOF'
          import re

          path = "android/app/build.gradle"
          content = open(path).read()

          def find_block(text, needle):
              """Return (open_brace_idx, close_brace_idx) for the {...} block
              that immediately follows the first match of `needle`."""
              m = re.search(needle, text)
              if not m:
                  raise ValueError(f"Could not find block starting with: {needle}")
              open_idx = text.index("{", m.end() - 1)
              depth = 0
              i = open_idx
              while i < len(text):
                  if text[i] == "{":
                      depth += 1
                  elif text[i] == "}":
                      depth -= 1
                      if depth == 0:
                          return open_idx, i
                  i += 1
              raise ValueError(f"Unbalanced braces for block: {needle}")

          # 1. Add a `release` signing config next to the existing `debug` one.
          sc_open, sc_close = find_block(content, r"signingConfigs\s*\{")
          release_signing_config = (
              "\n        release {\n"
              "            storeFile file('release.keystore')\n"
              "            storePassword System.getenv(\"STORE_PASSWORD\")\n"
              "            keyAlias System.getenv(\"KEY_ALIAS\")\n"
              "            keyPassword System.getenv(\"KEY_PASSWORD\")\n"
              "        }\n    "
          )
          content = content[:sc_close] + release_signing_config + content[sc_close:]

          # 2. Point buildTypes.release at signingConfigs.release instead of .debug.
          bt_open, bt_close = find_block(content, r"buildTypes\s*\{")
          build_types_block = content[bt_open:bt_close]
          rel_open, rel_close = find_block(build_types_block, r"release\s*\{")
          release_block = build_types_block[rel_open:rel_close]
          patched_release_block = release_block.replace(
              "signingConfig signingConfigs.debug", "signingConfig signingConfigs.release"
          )
          if patched_release_block == release_block:
              raise ValueError("Did not find signingConfig signingConfigs.debug inside buildTypes.release — template may have changed")
          build_types_block = build_types_block[:rel_open] + patched_release_block + build_types_block[rel_close:]
          content = content[:bt_open] + build_types_block + content[bt_close:]

          open(path, "w").write(content)
          print("✓ build.gradle wired to the release signing config")
          PYEOF

      # ── 10. Build release APK ──────────────────────────────────
      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease

      # ── 11. Upload APK to Cloudflare R2 ───────────────────────
      - name: Upload APK to Cloudflare R2
        id: upload
        env:
          R2_ACCOUNT_ID:        ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID:     ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME:       ${{ secrets.R2_BUCKET_NAME }}
          R2_PUBLIC_URL:        ${{ secrets.R2_PUBLIC_URL }}
          BUILD_ID:             ${{ inputs.build_id }}
        run: |
          APK="android/app/build/outputs/apk/release/app-release.apk"
          OBJECT_KEY="apks/${BUILD_ID}/app-release.apk"

          AWS_ACCESS_KEY_ID="${R2_ACCESS_KEY_ID}" \
          AWS_SECRET_ACCESS_KEY="${R2_SECRET_ACCESS_KEY}" \
          aws s3 cp "${APK}" "s3://${R2_BUCKET_NAME}/${OBJECT_KEY}" \
            --endpoint-url "https://${R2_ACCOUNT_ID}.r2.cloudflarestorage.com" \
            --region auto \
            --no-progress

          DOWNLOAD_URL="${R2_PUBLIC_URL}/${OBJECT_KEY}"
          echo "DOWNLOAD_URL=${DOWNLOAD_URL}" >> "$GITHUB_ENV"
          echo "✓ APK uploaded to R2 — ${DOWNLOAD_URL}"

          # Extract SHA256 fingerprint from the signed APK
          SHA256=$(keytool -printcert -jarfile "${APK}" 2>/dev/null | grep "SHA256:" | sed 's/.*SHA256: //' | tr -d ' \n')
          echo "SHA256_FINGERPRINT=${SHA256}" >> "$GITHUB_ENV"
          echo "✓ SHA256 fingerprint: ${SHA256}"

      # ── 12. Notify dashboard — success ────────────────────────
      # Only includes keystore fields when this build generated a brand
      # new signing key (first build for this app) — the dashboard
      # persists it so the next build reuses the same key.
      - name: Webhook — success
        if: success()
        env:
          WEBHOOK_URL:      ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET:   ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID:         ${{ inputs.build_id }}
          IS_NEW_KEYSTORE:  ${{ env.IS_NEW_KEYSTORE }}
          KEY_ALIAS:        ${{ env.KEY_ALIAS }}
          STORE_PASSWORD:   ${{ env.STORE_PASSWORD }}
          KEY_PASSWORD:     ${{ env.KEY_PASSWORD }}
        run: |
          if [ "$IS_NEW_KEYSTORE" = "true" ]; then
            NEW_KEYSTORE_BASE64=$(cat /tmp/new_keystore_base64.txt)
            PAYLOAD=$(jq -n \
              --arg build_id "$BUILD_ID" \
              --arg download_url "$DOWNLOAD_URL" \
              --arg sha256_fingerprint "$SHA256_FINGERPRINT" \
              --arg keystore_base64 "$NEW_KEYSTORE_BASE64" \
              --arg key_alias "$KEY_ALIAS" \
              --arg store_password "$STORE_PASSWORD" \
              --arg key_password "$KEY_PASSWORD" \
              '{build_id: $build_id, status: "success", download_url: $download_url,
                sha256_fingerprint: $sha256_fingerprint, keystore_base64: $keystore_base64,
                key_alias: $key_alias, store_password: $store_password, key_password: $key_password}')
          else
            PAYLOAD=$(jq -n \
              --arg build_id "$BUILD_ID" \
              --arg download_url "$DOWNLOAD_URL" \
              --arg sha256_fingerprint "$SHA256_FINGERPRINT" \
              '{build_id: $build_id, status: "success", download_url: $download_url,
                sha256_fingerprint: $sha256_fingerprint}')
          fi

          curl -fsSL -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "$PAYLOAD"
          echo "✓ Webhook notified — success"

      # ── 13. Notify dashboard — failure ────────────────────────
      - name: Webhook — failure
        if: failure()
        env:
          WEBHOOK_URL:    ${{ secrets.WEBHOOK_URL }}
          WEBHOOK_SECRET: ${{ secrets.WEBHOOK_SECRET }}
          BUILD_ID:       ${{ inputs.build_id }}
        run: |
          curl -fsSL -X POST "${WEBHOOK_URL}/api/webhook/build-complete" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${WEBHOOK_SECRET}" \
            -d "{\"build_id\":\"${BUILD_ID}\",\"status\":\"failed\",\"download_url\":\"\"}" || true
          echo "✓ Webhook notified — failure"
